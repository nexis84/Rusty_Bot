name: Skill Planner tests

on:
  push:
    paths:
      - "skillplanner/**"
      - "scripts/generate_skillplanner_fit_data.py"
      - ".github/workflows/skillplanner-tests.yml"
  pull_request:
    paths:
      - "skillplanner/**"
      - "scripts/generate_skillplanner_fit_data.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run calculator and SDE validation tests
        run: npm run test:skillplanner
