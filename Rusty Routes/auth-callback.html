<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="robots" content="noindex, nofollow">
    <title>Rusty Routes - EVE Login</title>
    <link rel="icon" type="image/png" href="../rusty_bot.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: #0d0d0d;
            color: #ddd;
            font-family: 'Titillium Web', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 28px 24px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .card h1 {
            font-size: 1.4rem;
            color: #e8d900;
            margin: 0 0 8px;
        }
        .card p {
            color: #888;
            font-size: 0.9rem;
            margin: 8px 0;
        }
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #2a2a2a;
            border-top-color: #e8d900;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .err {
            color: #e05555;
            background: rgba(224, 85, 85, 0.1);
            border: 1px solid rgba(224, 85, 85, 0.3);
            border-radius: 4px;
            padding: 10px;
            margin-top: 12px;
            font-size: 0.85rem;
            word-break: break-word;
        }
        a.back {
            display: inline-block;
            margin-top: 16px;
            color: #e8d900;
            text-decoration: none;
            font-size: 0.85rem;
        }
        a.back:hover { color: #f5e53b; }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fa-solid fa-right-to-bracket"></i> Rusty Routes Login</h1>
        <div id="status"><div class="spinner"></div><p>Exchanging EVE SSO code…</p></div>
        <a id="backLink" class="back" href="./">← Back to Rusty Routes</a>
    </div>

    <script>
    (async () => {
        const status = document.getElementById('status');
        const params = new URLSearchParams(window.location.search);
        const code  = params.get('code');
        const state = params.get('state');
        const err   = params.get('error');

        // API base: static (www) and API (api.rustybot.co.uk) are separate services.
        const RR_API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8080/api'
            : 'https://api.rustybot.co.uk/api';

        if (err) {
            status.innerHTML = `<p class="err">EVE returned an error: ${escapeHtml(err)}</p>`;
            return;
        }
        if (!code) {
            status.innerHTML = `<p class="err">No authorization code in callback URL.</p>`;
            return;
        }

        // Verify state matches what we stashed in startLogin()
        const expected = sessionStorage.getItem('rustyroutes:v1:oauth_state');
        if (expected && state && expected !== state) {
            status.innerHTML = `<p class="err">State mismatch — possible CSRF. Aborting.</p>`;
            return;
        }
        sessionStorage.removeItem('rustyroutes:v1:oauth_state');

        try {
            const res = await fetch(`${RR_API}/auth/rr/token-exchange`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

            // Stash in the same key the planner reads
            const auth = {
                access_token:    data.access_token,
                refresh_token:   data.refresh_token,
                character_id:    data.character_id,
                character_name:  data.character_name,
                expires_at:      Date.now() + (data.expires_in || 1200) * 1000,
            };
            sessionStorage.setItem('rustyroutes:v1:auth', JSON.stringify(auth));

            // Send the user back to the planner (or homepage as fallback)
            const ret = sessionStorage.getItem('rustyroutes:v1:return_to') || './';
            sessionStorage.removeItem('rustyroutes:v1:return_to');
            status.innerHTML = `<p>Logged in as <strong>${escapeHtml(data.character_name)}</strong>. Redirecting…</p>`;
            setTimeout(() => { window.location.href = ret; }, 400);
        } catch (e) {
            status.innerHTML = `<p class="err">Token exchange failed: ${escapeHtml(e.message)}</p>`;
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
    })();
    </script>
</body>
</html>
