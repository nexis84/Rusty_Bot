<!DOCTYPE html><html><head><meta charset="utf-8"><title>BV SSO callback</title></head><body><p>Completing SSO…</p><script>
(async function(){
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), state = q.get('state');
  if (!code) { document.body.textContent = 'No code returned.'; return; }
  if (state !== localStorage.getItem('bv_esi_state')) { document.body.textContent = 'State mismatch.'; return; }
  localStorage.removeItem('bv_esi_state');
  const isLocal = ['localhost','127.0.0.1'].includes(location.hostname);
  const base = isLocal ? 'http://localhost:8080' : 'https://api.rustybot.co.uk';
  try {
    const r = await fetch(base + '/api/bv/token-exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    if (!r.ok) throw new Error('exchange HTTP ' + r.status);
    const j = await r.json();
    localStorage.setItem('bv_esi_tokens', JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 1200) * 1000 }));
    if (j.character) localStorage.setItem('bv_esi_char', JSON.stringify(j.character));
  } catch (e) { document.body.textContent = 'SSO exchange failed: ' + e.message + ' (backend /api/bv/token-exchange required)'; return; }
  location.href = '../blueprint-visualizer/';
})();
</script></body></html>
