services:
  - type: web
    name: rustybot
    runtime: node
    repo: https://github.com/nexis84/Rusty_Bot.git
    branch: main
    buildCommand: npm install
    startCommand: node api/token-exchange.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EVE_CLIENT_ID
        sync: false
      - key: EVE_CLIENT_SECRET
        sync: false
      - key: EVE_PI_CLIENT_ID
        sync: false
      - key: EVE_PI_CLIENT_SECRET
        sync: false
      - key: EVE_BV_CLIENT_ID
        sync: false
      - key: EVE_BV_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: rustybot-frontend
    runtime: static
    repo: https://github.com/nexis84/Rusty_Bot.git
    branch: main
    buildCommand: ""
    staticPublishPath: .
    headers:
      # The tree's data files are served at fixed paths. Revalidate every load
      # (ETag makes it a cheap 304) so a new SDE build cannot sit behind a
      # 5-minute edge cache.
      - path: /shiptree/data/shiptree.json
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      - path: /shiptree/data/details.json
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      - path: /shiptree/data/skins.json
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
      # Skin icons are content-addressed (hash filenames), so they never change.
      - path: /market/skin-icons/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: redirect
        source: /light
        destination: /source/
      - type: redirect
        source: /light/*
        destination: /source/*
      - type: redirect
        source: /giveaway.html
        destination: /giveaway
      # Removed/renamed pages: keep any old inbound links pointing somewhere
      # useful instead of returning 404.
      - type: redirect
        source: /Killboard
        destination: /RustyStats/
      - type: redirect
        source: /Killboard/*
        destination: /RustyStats/
      - type: redirect
        source: /skin-gallery
        destination: /market/
      - type: redirect
        source: /skin-gallery/*
        destination: /market/
      - type: redirect
        source: /skinr-browser
        destination: /market/
      - type: redirect
        source: /skinr-browser/*
        destination: /market/
      - type: redirect
        source: /ship-guess-game
        destination: /top-trumps/
      - type: redirect
        source: /ship-guess-game/*
        destination: /top-trumps/
      - type: redirect
        source: /ship-higher-lower
        destination: /top-trumps/
      - type: redirect
        source: /ship-higher-lower/*
        destination: /top-trumps/
      - type: redirect
        source: /patchnotes.html
        destination: /patchnotes
      # Case-insensitive fallbacks (Render paths are case-sensitive).
      - type: redirect
        source: /support
        destination: /Support/
      - type: redirect
        source: /support/*
        destination: /Support/*
      - type: redirect
        source: /pi
        destination: /PI/
      - type: redirect
        source: /pi/*
        destination: /PI/*
      - type: redirect
        source: /fracturedskies
        destination: /Fracturedskies/
      - type: redirect
        source: /fracturedskies/*
        destination: /Fracturedskies/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sleeper-archive
    runtime: static
    repo: https://github.com/nexis84/Rusty_Bot.git
    branch: main
    buildCommand: ""
    staticPublishPath: SleeperArchive/dist
