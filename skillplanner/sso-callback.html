<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>EVE SSO Callback - Rusty Skill Planner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .callback-container {
            text-align: center;
            padding: 40px;
            background: rgba(22, 27, 34, 0.95);
            border-radius: 12px;
            border: 1px solid rgba(255, 165, 0, 0.3);
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .callback-container h1 {
            color: #ffa500;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .callback-container p {
            color: #c9d1d9;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 165, 0, 0.3);
            border-top-color: #ffa500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(81, 207, 102, 0.3);
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #ffa500;
            color: #0d1117;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #ff8c00;
            transform: translateY(-2px);
        }
    </style>
  <link rel="canonical" href="https://www.rustybot.co.uk/skillplanner/sso-callback.html">
</head>
<body>
    <div class="callback-container">
        <div id="loading-state">
            <div class="loading-spinner"></div>
            <h1>Processing SSO Login</h1>
            <p>Authenticating with EVE Online...</p>
        </div>
        
        <div id="error-state" style="display: none;">
            <h1>Authentication Failed</h1>
            <p id="error-message" class="error-message"></p>
            <a href="./" class="btn">Return to Skill Planner</a>
        </div>
        
        <div id="success-state" style="display: none;">
            <h1>Login Successful!</h1>
            <p id="success-message" class="success-message"></p>
            <a href="./" class="btn">Go to Skill Planner</a>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? `${window.location.origin}/api`
            : 'https://api.rustybot.co.uk/api';

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const successState = document.getElementById('success-state');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        function showState(name) {
            loadingState.style.display = 'none';
            errorState.style.display = 'none';
            successState.style.display = 'none';

            if (name === 'loading') loadingState.style.display = 'block';
            if (name === 'error') errorState.style.display = 'block';
            if (name === 'success') successState.style.display = 'block';
        }

        function returnTarget() {
            let returnTo = '';
            try { returnTo = localStorage.getItem('esi_return_to') || ''; } catch (_) {}
            return './' + (returnTo.startsWith('#') || returnTo.startsWith('?') || returnTo === '' ? returnTo : '#' + returnTo);
        }

        async function handleAuthentication() {
            const target = returnTarget();
            document.querySelectorAll('#success-state a.btn, #error-state a.btn').forEach(a => { a.href = target; });

            if (error) {
                showState('error');
                errorMessage.textContent = `EVE SSO Error: ${error} - ${errorDescription || 'Unknown error'}`;
                return;
            }
            if (!code) {
                showState('error');
                errorMessage.textContent = 'No authorization code received from EVE SSO.';
                return;
            }

            try {
                const savedState = localStorage.getItem('esi_state');
                if (state !== savedState) {
                    throw new Error('Invalid state parameter. Please start the sign-in again.');
                }
                localStorage.removeItem('esi_state');

                const response = await fetch(`${API_BASE}/sp/token-exchange`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.access_token) {
                    throw new Error(data.error || `Token exchange failed (HTTP ${response.status})`);
                }

                const characterId = String(data.character_id);
                const characterName = data.character_name || 'Unknown';
                const scopes = (Array.isArray(data.scopes) ? data.scopes : [])
                    .flatMap(scope => String(scope).split(/\s+/))
                    .filter(Boolean);
                const tokens = JSON.parse(localStorage.getItem('esi_tokens') || '{}');
                tokens[characterId] = {
                    characterId,
                    characterName,
                    accessToken: data.access_token,
                    refreshToken: data.refresh_token || null,
                    expiresAt: Date.now() + ((data.expires_in || 1200) * 1000),
                    scopes
                };
                localStorage.setItem('esi_tokens', JSON.stringify(tokens));
                localStorage.setItem('esi_current_character', characterId);

                // Clear cached character data so the dashboard fetches fresh data.
                const characterData = JSON.parse(localStorage.getItem('character_data') || '{}');
                if (characterData[characterId]) {
                    delete characterData[characterId];
                    localStorage.setItem('character_data', JSON.stringify(characterData));
                }

                // Clean the one-time code out of the address bar.
                window.history.replaceState({}, document.title, window.location.pathname);

                showState('success');
                successMessage.textContent = `Welcome, ${characterName}! Successfully authenticated with EVE Online.`;
                try { localStorage.removeItem('esi_return_to'); } catch (_) {}
                document.querySelectorAll('#success-state a.btn, #error-state a.btn').forEach(a => { a.href = target; });
                setTimeout(() => {
                    window.location.replace(target);
                }, 2000);
            } catch (err) {
                showState('error');
                errorMessage.textContent = `Authentication error: ${err.message}`;
                console.error('SSO Error:', err);
            }
        }

        handleAuthentication();
    </script>
</body>
</html>
