<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>The ISK is Right! — EVE Ship Price Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../rusty_bot.png">
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="canonical" href="https://www.rustybot.co.uk/the-isk-is-right/">
  <meta name="robots" content="index, follow">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <a href="../" class="brand-link">
        <img src="../rusty_bot.png" alt="RustyBot Logo" class="logo">
        <h1 class="brand-name">The ISK is <span class="accent">Right!</span></h1>
      </a>
    </div>
    <div class="breadcrumb">
      <span class="breadcrumb-item"><a href="../">Home</a></span>
      <span class="breadcrumb-item"><a href="./">The ISK is Right</a></span>
    </div>
  </header>

  <div class="container">
    <section class="hero-section">
      <img src="../rusty_bot.png" alt="RustyBot Logo" class="hero-logo">
      <h2>The ISK is <span class="accent">Right!</span></h2>
      <p>Guess which EVE ship costs more. Chain as many as you can!</p>
    </section>

    <div class="header-stats">
      <span>Streak: <strong id="streak-count">0</strong></span>
      <span class="streak-badge" id="streak-badge">🔥 0</span>
      <span>Round: <strong id="round-count">0</strong></span>
      <span>Ships: <strong id="ships-seen">0</strong></span>
      <span class="lives-display" id="lives-display"></span>
      <span class="buy-life-btn" id="buy-life-btn">🛒 Buy Life</span>
    </div>

    <div class="reward-bar">
      <span id="reward-total">0</span> ISK
    </div>

    <div id="game-area" class="game-area">
      <div class="loading">
        <div class="spinner"></div>
        <div>Fetching ship prices from Jita...</div>
      </div>
    </div>

    <div id="feedback" class="feedback"></div>

    <div id="guess-buttons" class="guess-buttons"></div>

    <div class="footer-bar">
      <span>Prices from Jita • The Forge</span>
      <span>Data via ESI</span>
    </div>
  </div>

  <script src="ships.js"></script>
  <script src="prices.js"></script>
  <script src="app.js"></script>
</body>
</html>
